<!doctype html>
<meta charset="utf-8">
<title>eSene Tech banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&display=block">
<style>
  /* Rendered at 1280x320 by headless Chrome; #dark selects the GitHub dark-theme variant. */
  :root { --bg: #FFFFFF; --fg: #0E1825; --sub: #647488; --acc: #0B5E76; }
  :root.dark { --bg: #0D1117; --fg: #E6EDF3; --sub: #7D8FA3; --acc: #25A0C3; }
  html, body { margin: 0; width: 1280px; height: 320px; overflow: hidden; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; gap: 56px; font-family: 'DM Sans', system-ui, sans-serif; }
  svg { width: 153px; height: 176px; color: var(--acc); display: block; }
  .name { font-size: 76px; letter-spacing: -0.03em; line-height: 1; color: var(--fg); }
  .name .e { color: var(--acc); font-weight: 700; }
  .name .sene { font-weight: 500; }
  .name .tech { color: var(--sub); font-weight: 300; }
</style>
<script>if (location.hash === '#dark') document.documentElement.classList.add('dark');</script>

  </g>
  <g fill="currentColor">
    <circle cx="72" cy="30" r="5.2"/>
    <circle cx="50" cy="18" r="5.2"/>
    <circle cx="20" cy="50" r="7"/>
    <circle cx="50" cy="82" r="5.2"/>
    <circle cx="72" cy="70" r="5.2"/>
    <circle cx="68" cy="50" r="5.2"/>
  </g>
</svg>
