<!doctype html>
<meta charset="utf-8">
<title>eSene Tech lockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&display=block">
<style>
  /* Rendered by headless Chrome on a transparent page, then cropped to the ink and padded.
     Hash selects the variant: #light or #dark, plus -small for the heavier mark used at 64px and below. */
  :root { --fg: #0E1825; --sub: #647488; --acc: #0B5E76; }
  :root.dark { --fg: #E6EDF3; --sub: #7D8FA3; --acc: #25A0C3; }
  html, body { margin: 0; background: transparent; }
  .lockup { display: inline-flex; align-items: center; gap: 140px; padding: 80px; font-family: 'DM Sans', system-ui, sans-serif; }
  svg { height: 440px; width: auto; color: var(--acc); display: block; }
  .name { font-size: 190px; letter-spacing: -0.03em; line-height: 1; color: var(--fg); white-space: nowrap; }
  .name .e { color: var(--acc); font-weight: 700; }
  .name .sene { font-weight: 500; }
  .name .tech { color: var(--sub); font-weight: 300; }
  .small-only { display: none; }
  :root.small .std-only { display: none; }
  :root.small .small-only { display: block; }
</style>
<script>
  const h = location.hash.slice(1);
  if (h.startsWith('dark')) document.documentElement.classList.add('dark');
  if (h.endsWith('-small')) document.documentElement.classList.add('small');
</script>

<div class="lockup">
  <svg class="std-only" viewBox="12 11 68 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="currentColor" stroke-linecap="round" fill="none">
      <line x1="72" y1="30" x2="50" y2="18" stroke-width="3.4"/>
      <line x1="50" y1="18" x2="20" y2="50" stroke-width="3.4"/>
      <line x1="20" y1="50" x2="50" y2="82" stroke-width="3.4"/>
      <line x1="50" y1="82" x2="72" y2="70" stroke-width="3.4"/>
      <line x1="20" y1="50" x2="68" y2="50" stroke-width="3.4"/>
      <line x1="50" y1="18" x2="68" y2="50" stroke-width="1.8" stroke-opacity="0.3"/>
    </g>
    <g fill="currentColor">
      <circle cx="72" cy="30" r="5.2"/><circle cx="50" cy="18" r="5.2"/><circle cx="20" cy="50" r="7"/>
      <circle cx="50" cy="82" r="5.2"/><circle cx="72" cy="70" r="5.2"/><circle cx="68" cy="50" r="5.2"/>
    </g>
  </svg>
  <svg class="small-only" viewBox="11 11 68 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="currentColor" stroke-linecap="round" fill="none" stroke-width="5">
      <line x1="72" y1="30" x2="50" y2="18"/>
      <line x1="50" y1="18" x2="20" y2="50"/>
      <line x1="20" y1="50" x2="50" y2="82"/>
      <line x1="50" y1="82" x2="72" y2="70"/>
      <line x1="20" y1="50" x2="68" y2="50"/>
    </g>
    <g fill="currentColor">
      <circle cx="72" cy="30" r="6.5"/><circle cx="50" cy="18" r="6.5"/><circle cx="20" cy="50" r="8.5"/>
      <circle cx="50" cy="82" r="6.5"/><circle cx="72" cy="70" r="6.5"/><circle cx="68" cy="50" r="6.5"/>
    </g>
  </svg>
  <div class="name"><span class="e">e</span><span class="sene">Sene</span><span class="tech"> Tech</span></div>
</div>
